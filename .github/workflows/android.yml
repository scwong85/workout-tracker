name: Android CI

# Automatic runs are disabled for now; trigger manually from the Actions tab when needed.
on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests
        run: ./gradlew :domain:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/**/build/reports/**
            android/app/schemas/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
